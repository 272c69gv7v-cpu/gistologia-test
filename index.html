 <button class="b g" id="all">Все вопросы вперемешку (${D.length})</button>
 <h2>По темам</h2><div id="tp"></div>`;
 document.getElementById('r50').onclick=()=>start(sh(D).slice(0,50));
 document.getElementById('all').onclick=()=>start(sh(D));
 const tp=document.getElementById('tp');
 Object.keys(U).forEach(k=>{const n=D.filter(x=>x.t===k).length;if(!n)return;
  const b=document.createElement('button');b.className='o2 t';
  const a=document.createElement('b');a.textContent=U[k];a.style.fontWeight='500';const c=document.createElement('span');c.textContent=n;
  b.append(a,c);b.onclick=()=>start(sh(D.filter(x=>x.t===k)));tp.appendChild(b)});
}
function opts(x){
 const a=ans(x),seen=new Set(),r=[];
 const add=u=>{const k=u.toLowerCase();if(!seen.has(k)&&r.length<5){seen.add(k);r.push(u)}};
 if(x.o){x.o.forEach(add);if(!x.x&&r.length<5){sh(x.w||[]).forEach(add);sh((x.d||[]).slice(0,8)).forEach(add)}return x.x?r:sh(r)}
 add(a);sh(x.w).slice(0,2).forEach(add);sh(x.d.slice(0,8)).forEach(add);
 if(r.length<5)sh(D.filter(y=>y.t===x.t&&!y.o)).slice(0,20).forEach(y=>add(y.a));
 return sh(r);
}
function start(p){Q=p;i=0;score=0;wrong=[];show()}
function show(){
 const x=Q[i];answered=false;const o=opts(x);
 app.innerHTML=`<div class="top"><span>Вопрос ${i+1} из ${Q.length}</span><span>Верно: ${score}</span></div>
 <div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
 <div class="c"><div class="q"></div><div id="ops"></div><button class="b hid" id="nx" style="margin-top:14px"></button></div>
 <button class="b g" id="ex">Завершить</button>`;
 app.querySelector('.q').textContent=x.q;
 const ops=document.getElementById('ops');
 o.forEach(t=>{const bt=document.createElement('button');bt.className='o2';bt.textContent=t;bt.onclick=()=>pick(bt,t,x);ops.appendChild(bt)});
 document.getElementById('ex').onclick=()=>{Q=Q.slice(0,i+(answered?1:0));finish()};
}
function pick(bt,t,x){
 if(answered)return;answered=true;
 const a=ans(x);if(t===a)score++;else wrong.push(x);
 [...document.querySelectorAll('.o2')].forEach(b=>{if(b.textContent===a)b.classList.add('ok');else if(b===bt)b.classList.add('no')});
 const nx=document.getElementById('nx');nx.classList.remove('hid');nx.textContent=i+1<Q.length?'Дальше':'Результат';
 nx.onclick=()=>{i++;i<Q.length?show():finish()};
}
function finish(){
 const n=Q.length,pc=n?Math.round(score/n*100):0;
 app.innerHTML=`<h1>Результат</h1><div class="big">${score} / ${n}</div><p class="s" style="text-align:center">${pc}% верных ответов</p><div id="wr"></div>
 ${wrong.length?'<button class="b" id="rt">Повторить ошибки</button>':''}<button class="b g" id="mn">В меню</button>`;
 const wr=document.getElementById('wr');
 if(wrong.length){const h=document.createElement('p');h.className='s';h.textContent='Разбор ошибок:';wr.appendChild(h)}
 wrong.forEach(x=>{const d=document.createElement('div');d.className='m';const b=document.createElement('b');b.textContent=x.q;const s=document.createElement('span');s.textContent=ans(x);d.append(b,s);wr.appendChild(d)});
 const rt=document.getElementById('rt');if(rt)rt.onclick=()=>start(sh(wrong));
 document.getElementById('mn').onclick=menu;
}
menu();
</script></body></html>
